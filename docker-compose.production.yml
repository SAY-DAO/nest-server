version: "3.9"

services:
  traefik:
    image: traefik:v3.6
    command:
      - --providers.swarm=true
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.email=admin@say.com
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --api.dashboard=true
      - --log.level=INFO
      - --accesslog=true
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt
    networks:
      - traefik-public
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  api:
    image: ${CONTAINER_IMAGE:-backend}
    volumes:
      - uploads_volume:/usr/src/app/uploads
    environment:
      PORT: 3000
      DB_HOST: db
      DB_USER: nestserver
      DB_NAME: say_dapp
      DB_PASS_FILE: /run/secrets/postgres-password
    secrets:
      - postgres-password
    networks:
      - default
      - traefik-public
    configs:
      - source: nest-config
        target: /usr/src/app/.env
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: start-first
      placement:
        constraints:
          - node.labels.${ENVIRONMENT} == true
      mode: replicated
      labels:
        - traefik.enable=true
        - traefik.docker.network=traefik-public
        - traefik.constraint-label=traefik-public
        - traefik.http.routers.${STACK_NAME}-api-http.entrypoints=http
        - traefik.http.routers.${STACK_NAME}-api-http.rule=Host(`${DOMAIN?Variable not set}`)
        - traefik.http.routers.${STACK_NAME}-api-http.service=${STACK_NAME}-api
        - traefik.http.routers.${STACK_NAME}-api-http.middlewares=https-redirect
        - traefik.http.routers.${STACK_NAME}-api.entrypoints=https
        - traefik.http.routers.${STACK_NAME}-api.rule=Host(`${DOMAIN?Variable not set}`)
        - traefik.http.routers.${STACK_NAME}-api.service=${STACK_NAME}-api
        - traefik.http.routers.${STACK_NAME}-api.tls=true
        - traefik.http.routers.${STACK_NAME}-api.tls.certresolver=le
        - traefik.http.services.${STACK_NAME}-api.loadbalancer.server.port=3000

  db:
    image: postgres:12
    secrets:
      - postgres-password
    environment:
      POSTGRES_DB: say_dapp
      POSTGRES_USER: nestserver
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    volumes:
      - postgres_volume:/var/lib/postgresql/data
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: stop-first
      placement:
        constraints:
          - node.labels.${ENVIRONMENT} == true

volumes:
  postgres_volume:
    name: "${STACK_NAME}_postgres_volume"
  uploads_volume:
    name: "${STACK_NAME}_uploads_volume"

networks:
  traefik-public:
    external: true

secrets:
  postgres-password:
    name: ${STACK_NAME}-postgres-password
    external: true

configs:
  nest-config:
    name: ${STACK_NAME}.env
    external: true
